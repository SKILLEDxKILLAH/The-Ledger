name: SillyTavern Android APK

# Builds android/sillytavern into an APK for the Pixel 9 Pro (arm64-v8a), boot-tests
# the same app on an x86_64 emulator, then publishes the APK as a GitHub Release so
# it can be downloaded straight to the phone.
#
# Signing: android/sillytavern/signing/release.p12.enc is the app's permanent key,
# encrypted; the repository secret ST_KEYSTORE_PASSWORD decrypts it. Releases are
# only published when the APK carries that key (checked against
# signing/release-cert.sha256), so every release installs over the last one.

on:
  push:
    branches:
      - claude/awesome-hawking-q13pqe
    paths:
      - android/sillytavern/**
      - .github/workflows/sillytavern-android.yml
  workflow_dispatch:
    inputs:
      st_ref:
        description: SillyTavern tag or branch to package
        default: "1.19.0"

permissions:
  contents: write

concurrency:
  group: sillytavern-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ST_REF: ${{ inputs.st_ref || '1.19.0' }}
  PROJECT: android/sillytavern

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64 # Pixel 9 Pro
            abi: arm64-v8a
            task: assembleRelease
          - arch: x86_64 # emulator boot test only
            abi: x86_64
            task: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage Node.js runtime (Termux build for Android)
        run: python3 $PROJECT/scripts/prepare-runtime.py ${{ matrix.arch }}

      - name: Stage SillyTavern ${{ env.ST_REF }}
        run: $PROJECT/scripts/prepare-payload.sh "$ST_REF"

      - name: Signing key
        if: matrix.task == 'assembleRelease'
        env:
          KS_PASS: ${{ secrets.ST_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/st.p12"
          if [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$PROJECT/signing/release.p12.enc" -out "$ks" -pass env:KS_PASS
          else
            echo "::warning::No ST_KEYSTORE_PASSWORD secret: signing with a throwaway key. This build will not be released."
            KS_PASS=throwaway
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" -alias st \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway"
          fi
          echo "::add-mask::$KS_PASS"
          {
            echo "ST_KEYSTORE_FILE=$ks"
            echo "ST_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ST_KEY_ALIAS=st"
            echo "ST_KEY_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          ./gradlew --no-daemon ${{ matrix.task }} \
            -PstAbi=${{ matrix.abi }} -PstVersion="$ST_REF" -PstVersionCode=${{ github.run_number }}
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$apk" "$GITHUB_WORKSPACE/out/LedgerTavern-$ST_REF-${{ matrix.abi }}.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: out/*.apk
          compression-level: 0

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot SillyTavern on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash android/sillytavern/scripts/emulator-boot-test.sh out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: |
            screenshot.png
            server.log
            logcat.txt

  release:
    needs: [build, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android/sillytavern/signing

      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: out

      - name: Check the APK carries the permanent key
        id: sig
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs out/*.apk 2>&1) || { echo "$certs"; exit 1; }
          echo "$certs" | grep -i "SHA-256 digest" || true
          # "Signer #1 ..." or, with v3.1 signing, "Signer (minSdkVersion=...) ..."
          got=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')
          want=$(tr -d '[:space:]' < "$PROJECT/signing/release-cert.sha256")
          echo "APK certificate: $got"
          if [ "$got" = "$want" ]; then
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            echo "permanent=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK is not signed with the permanent key (add the ST_KEYSTORE_PASSWORD secret). Not publishing a release; the APK is in this run's artifacts."
          fi

      - uses: softprops/action-gh-release@v2
        if: steps.sig.outputs.permanent == 'true'
        with:
          tag_name: ledger-tavern-${{ github.run_number }}
          name: Ledger Tavern ${{ env.ST_REF }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: out/*.apk
          body: |
            SillyTavern ${{ env.ST_REF }} as a standalone Android app in The Ledger's look, with the Plugin Ledger browser. Built for the Pixel 9 Pro (arm64-v8a, Android 14+).

            **Install:** download the APK on your phone and open it (allow "Install unknown apps" for your browser when asked). Builds from this one on are signed with the same permanent key, so later updates install over it and keep your chats.

            Always the newest: https://github.com/${{ github.repository }}/releases/latest

            SillyTavern is AGPL-3.0: source at https://github.com/SillyTavern/SillyTavern/tree/${{ env.ST_REF }}; the app's own source is in android/sillytavern of this repository.

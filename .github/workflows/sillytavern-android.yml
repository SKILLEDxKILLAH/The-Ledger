name: SillyTavern Android APK

# Builds android/sillytavern into an APK for the Pixel 9 Pro (arm64-v8a), boot-tests
# the same app on an x86_64 emulator, then publishes the APK as a GitHub Release so
# it can be downloaded straight to the phone.
#
# Optional signing secrets (set once so every build installs over the previous one
# and keeps your chats): ST_KEYSTORE_BASE64, ST_KEYSTORE_PASSWORD. The key alias is
# "st" and the key password equals the store password. Without them each run is
# signed with a throwaway key and updating means uninstalling first.

on:
  push:
    branches:
      - claude/awesome-hawking-q13pqe
    paths:
      - android/sillytavern/**
      - .github/workflows/sillytavern-android.yml
  workflow_dispatch:
    inputs:
      st_ref:
        description: SillyTavern tag or branch to package
        default: "1.19.0"

permissions:
  contents: write

concurrency:
  group: sillytavern-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ST_REF: ${{ inputs.st_ref || '1.19.0' }}
  PROJECT: android/sillytavern

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64 # Pixel 9 Pro
            abi: arm64-v8a
            task: assembleRelease
          - arch: x86_64 # emulator boot test only
            abi: x86_64
            task: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage Node.js runtime (Termux build for Android)
        run: python3 $PROJECT/scripts/prepare-runtime.py ${{ matrix.arch }}

      - name: Stage SillyTavern ${{ env.ST_REF }}
        run: $PROJECT/scripts/prepare-payload.sh "$ST_REF"

      - name: Signing key
        if: matrix.task == 'assembleRelease'
        env:
          KS_B64: ${{ secrets.ST_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ST_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/st.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
          else
            echo "::warning::No ST_KEYSTORE_BASE64 secret; signing with a throwaway key. Uninstall the old APK before installing this one."
            KS_PASS=throwaway
            keytool -genkeypair -keystore "$ks" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias st \
              -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=SillyTavern Pocket"
          fi
          {
            echo "ST_KEYSTORE_FILE=$ks"
            echo "ST_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ST_KEY_ALIAS=st"
            echo "ST_KEY_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          ./gradlew --no-daemon ${{ matrix.task }} \
            -PstAbi=${{ matrix.abi }} -PstVersion="$ST_REF" -PstVersionCode=${{ github.run_number }}
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$apk" "$GITHUB_WORKSPACE/out/SillyTavern-$ST_REF-${{ matrix.abi }}.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: out/*.apk
          compression-level: 0

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot SillyTavern on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash android/sillytavern/scripts/emulator-boot-test.sh out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: |
            screenshot.png
            server.log
            logcat.txt

  release:
    needs: [build, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sillytavern-android-${{ github.run_number }}
          name: SillyTavern ${{ env.ST_REF }} for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk
          body: |
            SillyTavern ${{ env.ST_REF }} packaged as a standalone Android app, built for the Pixel 9 Pro (arm64-v8a, Android 14+).
            Download the APK on your phone and open it to install (allow "Install unknown apps" for your browser when asked).

            SillyTavern is AGPL-3.0: source at https://github.com/SillyTavern/SillyTavern/tree/${{ env.ST_REF }}; wrapper source in android/sillytavern of this repository.

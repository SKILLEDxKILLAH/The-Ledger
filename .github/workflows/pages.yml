name: Deploy to GitHub Pages

# Publishes the static site (index.html at the repo root) to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source =
# "GitHub Actions". After that, every push to the branches below redeploys.

on:
  push:
    branches:
      - main
      - claude/character-builder-api-csj626
  workflow_dispatch:

# Least-privilege token that can publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source: GitHub Actions) on first run using the
          # workflow's pages:write token, so no manual repo setting is needed.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is static; the root index.html is the app.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
